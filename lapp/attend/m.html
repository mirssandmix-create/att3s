<script>
"use strict";
/* ═══ ข้อมูล ═══ */
var BOOT = null, CUR = "", DAY = null, FILTER = "all", QTXT = "", NAMES = {}, PER = null, FORM = null, BUSY = false, NEED_REDRAW = false;
var SPECIAL = ["🏠 ลากลับบ้าน", "🤒 ลาป่วย", "📋 ลากิจ", "🌴 วันหยุด", "🚫 พักงาน", "✈️ ลาพักร้อน"], AUTO = "🔄 คืนค่าอัตโนมัติ";
var TH_M = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
var TH_D = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} return null; }
function baht(n) { n = +n || 0; var neg = n < 0; n = Math.abs(n); var s = (Math.round(n * 100) / 100).toLocaleString("en-US", { maximumFractionDigits: 2 }); return (neg ? "−" : "") + "฿" + s; }
function ymd(s) { var p = String(s || "").split("-"); return { y: +p[0], m: +p[1], d: +p[2] }; }
function dayKey(y, m, d) { var t = new Date(Date.UTC(y, m - 1, d)); return t.getUTCFullYear() + "-" + ("0" + (t.getUTCMonth() + 1)).slice(-2) + "-" + ("0" + t.getUTCDate()).slice(-2); }
function addDays(s, n) { var a = ymd(s); return dayKey(a.y, a.m, a.d + n); }
function thDate(s, long) { var a = ymd(s); if (!a.y) return s; var w = new Date(Date.UTC(a.y, a.m - 1, a.d)).getUTCDay();
  return (long ? "วัน" + TH_D[w] + " " : "") + a.d + " " + TH_M[a.m - 1] + (long ? " " + (a.y + 543) : ""); }
function thShort(s) { var a = ymd(s); var w = new Date(Date.UTC(a.y, a.m - 1, a.d)).getUTCDay(); return TH_D[w].slice(0, 2) + ". " + a.d + " " + TH_M[a.m - 1]; }
function nowHM() { var t = new Date(Date.now() + 7 * 3600e3); return ("0" + t.getUTCHours()).slice(-2) + ":" + ("0" + t.getUTCMinutes()).slice(-2); }
/* วันนี้ (เวลาไทย) จากนาฬิกามือถือ — แอพเปิดค้างข้ามคืนก็ขยับวันเอง */
function TODAY() { return new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10); }
var LAST_TODAY = TODAY();
function uid() { return "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function noT(t) { return !t || t === "--:--"; }

/* เรียกโค้ดเว็บ (คิดในเครื่อง) */
function call(route, p) {
  return LAPP.run("api", [route, p || {}, "local"]).then(function (r) {
    if (!r || r.ok === false) throw new Error((r && r.error) || "ไม่สำเร็จ");
    return r.data;
  });
}
function labelOf(a) {
  var r = a && a[0], p = (a && a[1]) || {}, nm = NAMES[String(p.id)] || ("#" + (p.id || ""));
  var d = p.date ? " · " + thDate(p.date) : "";
  if (r === "time.addAdv") return "เบิก " + baht(p.amount).slice(1) + " บาท · " + nm + d;
  if (r === "time.editAdv") return "แก้เบิก " + baht(p.amount).slice(1) + " บาท · " + nm + d;
  if (r === "time.delAdv") return "ลบรายการเบิก · " + nm + d;
  if (r === "time.saveRows") { var c = (p.changes || [])[0] || {}; return "แก้เวลา/สถานะ · " + (NAMES[String(c.id)] || ("#" + (c.id || ""))) + (c.date ? " · " + thDate(c.date) : ""); }
  return String(r || "");
}

/* ═══ กล่องแจ้ง ═══ */
var TT = 0;
function toast(m, er) { var t = $("toast"); t.textContent = m; t.className = "on" + (er ? " er" : ""); clearTimeout(TT); TT = setTimeout(function () { t.className = ""; }, er ? 5000 : 2600); }
/* ข้อความยาว (กติกาของเว็บอธิบายหลายบรรทัด) = กล่องแจ้ง · สั้น = แถบล่าง */
function showErr(m) { m = String(m || "ไม่สำเร็จ"); if (m.length > 60 || m.indexOf("\n") >= 0) ask("❌ " + m, "ตกลง", false); else toast("❌ " + m, true); }
var DLG = null;
function ask(text, yes, no) {
  return new Promise(function (res) {
    $("dlgT").textContent = text; $("dlgY").textContent = yes || "ตกลง";
    $("dlgN").style.display = no === false ? "none" : ""; $("dlgN").textContent = no || "ยกเลิก";
    $("dlg").className = "on"; DLG = res;
  });
}
function dlgDone(v) { $("dlg").className = ""; var f = DLG; DLG = null; if (f) f(v); }
$("dlgY").onclick = function () { dlgDone(true); };
$("dlgN").onclick = function () { dlgDone(false); };

/* ═══ เริ่ม ═══ */
LAPP.ready().then(start, function (e) { $("main").innerHTML = '<div class="load"><b>เริ่มไม่ได้</b>' + esc(e && e.message || e) + '</div>'; });
function start() {
  return call("time.bootstrap", {}).then(function (b) {
    BOOT = b;
    (b.employees || []).concat(b.special || []).forEach(function (e) { NAMES[String(e.id)] = e.name; });
    if (!CUR) CUR = TODAY();
    return loadDay();
  }).then(function () {
    var d = draftGet();
    if (d) restoreDraft(d);
  }).catch(function (e) { $("main").innerHTML = '<div class="load"><b>เปิดข้อมูลไม่ได้</b>' + esc(e.message) + '</div>'; });
}
function loadDay() {
  var want = CUR;
  return call("time.getDay", { date: want }).then(function (d) {
    // วันนี้ยังไม่มีในระบบ (ชีตยังเป็นวันก่อน ยังไม่ปิดยอด) = แสดงวันล่าสุดที่มี พร้อมบอก
    if (!d.found && want === TODAY()) return call("time.getDay", { date: "latest" }).then(function (l) { if (l.found) { l.fallbackFrom = want; return l; } return d; }, function () { return d; });
    return d;
  }).then(function (d) { if (CUR !== want) return; DAY = d; render(); }, function (e) { if (CUR !== want) return; DAY = { found: false, rows: [], err: e.message }; render(); });
}
/* ข้ามวัน (เปิดแอพค้างไว้ข้ามคืน) → ไปวันใหม่ถ้ากำลังดู "วันนี้" อยู่ */
function dayRoll() {
  var t = TODAY();
  if (t === LAST_TODAY || !BOOT) return;
  var was = LAST_TODAY;
  LAST_TODAY = t;
  if (CUR === was) CUR = t;
  if (FORM || BUSY) { NEED_REDRAW = true; return; }
  refresh();
}
document.addEventListener("visibilitychange", function () { if (!document.hidden) dayRoll(); });
function onRebase() {
  if (!BOOT) return;
  if (FORM || BUSY) { NEED_REDRAW = true; return; }
  refresh();
}
function refresh() {
  NEED_REDRAW = false;
  call("time.bootstrap", {}).then(function (b) { BOOT = b; (b.employees || []).forEach(function (e) { NAMES[String(e.id)] = e.name; }); }).catch(function () {});
  return loadDay().then(function () { if (PER) return openPerson(PER.id, PER.from, PER.to, true); });
}

/* ═══ หน้าวัน ═══ */
function catOf(r) {
  if (SPECIAL.indexOf(r.status) >= 0) return "lv";
  if (!noT(r.in)) return "came";
  return "not";
}
function stCls(s) {
  s = String(s || "");
  if (SPECIAL.indexOf(s) >= 0) return "lv";
  if (/ปกติ/.test(s)) return "ok";
  if (/สาย/.test(s)) return "late";
  if (/ไม่มา|ลืม/.test(s)) return "no";
  return "";
}
function render() {
  var d = DAY || { rows: [] }, today = TODAY();
  $("dayTx").innerHTML = esc(thDate(CUR, true)) + (CUR === today ? "<small>วันนี้</small>" : "");
  $("dayPick").value = CUR;
  $("nextBtn").style.visibility = CUR >= today ? "hidden" : "";
  var rows = d.rows || [], c = { all: rows.length, came: 0, not: 0, lv: 0 };
  rows.forEach(function (r) { c[catOf(r)]++; });
  var F = [["all", "ทั้งหมด"], ["came", "มาแล้ว"], ["not", "ยังไม่มา"], ["lv", "ลา/หยุด"]];
  $("flt").innerHTML = F.map(function (f) { return '<button class="pill' + (FILTER === f[0] ? " on" : "") + '" data-flt="' + f[0] + '">' + f[1] + " " + c[f[0]] + "</button>"; }).join("");
  if (!d.found) {
    $("main").innerHTML = '<div class="empty">' + (d.err ? "⚠ " + esc(d.err) : "ไม่มีข้อมูลเวลาทำงานของ" + esc(thDate(CUR, true))) + "</div>";
    return;
  }
  var s = d.summary || {}, q = QTXT.trim().toLowerCase(), h = "";
  if (d.fallbackFrom) h += '<div class="banner w" style="margin:0 0 10px">ยังไม่มีข้อมูลของ' + esc(thDate(d.fallbackFrom, true)) + " — แสดงวันล่าสุดในระบบ: <b>" + esc(thDate(d.date, true)) + "</b></div>";
  h += '<div class="sum"><div class="p"><b>' + baht(s.pay) + '</b><span>ค่าแรงวันนี้</span></div><div class="a"><b>' + baht(s.adv) + '</b><span>เบิกวันนี้</span></div>'
    + '<div><b>' + (s.work || 0) + ' <small style="font-size:.75rem;color:var(--mu)">คน</small></b><span>มา' + (s.late ? " · สาย " + s.late : "") + '</span></div></div>';
  var shown = 0;
  rows.forEach(function (r, i) {
    if (FILTER !== "all" && catOf(r) !== FILTER) return;
    if (q && String(r.name).toLowerCase().indexOf(q) < 0 && String(r.id) !== q) return;
    shown++;
    h += card(r, i);
  });
  if (!shown) h += '<div class="empty">ไม่มีรายชื่อที่ตรง</div>';
  $("main").innerHTML = h;
}
function fineTags(f) {
  if (!f) return "";
  return (f.late ? '<span class="fine">⏰ สาย −' + f.late + "</span>" : "") + (f.early ? '<span class="fine">🏃 เลิกก่อน −' + f.early + "</span>" : "");
}
function card(r, i) {
  var advs = r.advs || [], h = '<div class="card" data-i="' + i + '">';
  h += '<div class="ch"><div class="nm" data-act="person">' + esc(r.name) + '<span class="id">#' + esc(r.id) + '</span><span class="go"> ›</span></div>'
    + '<span class="st ' + stCls(r.status) + '">' + esc(r.status || "—") + "</span></div>";
  h += '<div class="tm"><span>เข้า <b' + (r.fine && r.fine.late ? ' class="fl"' : "") + ">" + esc(r.in || "--:--") + '</b></span><span>ออก <b' + (r.fine && r.fine.early ? ' class="fl"' : "") + ">"
    + esc(r.out || "--:--") + "</b></span>" + (r.hrs ? "<span>" + r.hrs + " ชม.</span>" : "") + "</div>";
  var mo = (r.pay ? '<span class="pay">ค่าแรง ' + baht(r.pay) + "</span>" : "") + (r.tip ? '<span class="pay">ทิป ' + baht(r.tip) + "</span>" : "")
    + (r.adv ? '<span class="adv">เบิก ' + baht(r.adv) + "</span>" : "") + fineTags(r.fine);
  if (r.per) mo += '<span class="per' + (r.per.net < 0 ? " neg" : "") + '">งวดนี้เหลือ ' + baht(r.per.net) + "</span>";
  if (mo) h += '<div class="mo">' + mo + "</div>";

    advs.forEach(function (a, k) {

        + (a.photo ? '<img src="' + esc(a.photo) + '" alt="" loading="lazy" data-zoom="' + esc(a.photo) + '">' : '<span class="noimg">📷</span>') + "</button>";

/* ═══ กดในหน้า ═══ */
document.addEventListener("click", function (e) {
  var z = e.target.closest("[data-zoom]");

  var b = e.target.closest("[data-act]");
  if (!b) return;
  var act = b.getAttribute("data-act"), cd = b.closest("[data-i]"), r = null;
  if (cd) { var src = cd.getAttribute("data-src") === "p" ? (PER && PER.data && PER.data.rows) : (DAY && DAY.rows); r = src ? src[+cd.getAttribute("data-i")] : null; }
  if (act === "menu") return menu();
  if (!BOOT) return;
  if (act === "prev") { CUR = addDays(CUR, -1); return loadDay(); }
  if (act === "next") { if (CUR < TODAY()) { CUR = addDays(CUR, 1); return loadDay(); } return; }
  if (!r) return;
  if (act === "person") return openPerson(r.id);
  if (act === "adv") return advForm(r, null);
  if (act === "aedit") return editAdvGuard(r, (r.advs || [])[+b.getAttribute("data-k")]);
  if (act === "edit") return editForm(r);
}, false);
$("dayPick").onchange = function () { var v = this.value; if (!v || !BOOT) return; if (v > TODAY()) v = TODAY(); CUR = v; loadDay(); };
/* แถวที่ยังมีคำสั่งรอเว็บยืนยัน = ยังแก้/ลบรายการเบิกไม่ได้ (รหัสรายการในมือถือกับบนเว็บอาจไม่ตรงกันจนกว่าจะดึงชีตใหม่) */
function rowPending(r) {
  var st = LAPP.state && LAPP.state(), k = r.date + "|" + r.id;

}
function editAdvGuard(r, a) {

  if (rowPending(r)) { ask("⏳ รายการของ " + r.name + " วันนั้นยังรอส่งขึ้นเว็บ\nรอให้ป้ายด้านบนขึ้น \"☁ ✓ ตรงกับเว็บแล้ว\" ก่อน แล้วค่อยแก้/ลบ\n(กันแก้ผิดรายการ)", "ตกลง", false); return; }

$("dayBtn").onclick = function (e) { var p = $("dayPick"); try { if (p.showPicker) { p.showPicker(); e.preventDefault(); } } catch (x) {} };
$("q").oninput = function () { QTXT = this.value; render(); };
function zoom(u) { $("zm").querySelector("img").src = String(u).replace("sz=w800", "sz=w1600"); $("zm").className = "on"; }

/* ═══ หน้าต่างล่าง ═══ */
function openSheet(html) { $("sheet").onclick = null; $("sheet").oninput = null; $("sheet").innerHTML = '<div class="grab"></div>' + html; $("sheet").scrollTop = 0; $("sheet").className = "sheet on"; $("mask").className = "on"; }

function backSheet() {

  draftClear(); closeSheet();
}
/* ปุ่มย้อนกลับของมือถือ (app.html เรียก) · true = ปิดอะไรไปแล้ว */
window.appBackInner = function () {
  if ($("zm").className === "on") { $("zm").className = ""; return true; }
  if (DLG) { dlgDone(false); return true; }
  if ($("sheet").classList.contains("on")) { backSheet(); return true; }
  if (PER) { closePerson(); return true; }

};

/* ═══ เบิกเงิน ═══ */
function perLine(r) {
  if (!r.per) return "";
  return '<div class="perbox">งวดนี้ถึงวันนี้ · ค่าแรง <b>' + baht(r.per.pay) + "</b> · เบิกแล้ว <b>" + baht(r.per.adv) + '</b> · เหลือ <b class="' + (r.per.net < 0 ? "neg" : "") + '">' + baht(r.per.net) + "</b></div>";
}
function payers() {
  var seen = {}, out = [];
  (JSON.parse(ls("attPayers") || "[]")).concat((DAY && DAY.rows || []).reduce(function (a, r) { return a.concat((r.advs || []).map(function (x) { return x.payer; })); }, []))
    .forEach(function (p) { p = String(p || "").trim(); if (p && !seen[p] && out.length < 8) { seen[p] = 1; out.push(p); } });
  return out;
}
function rememberPayer(p) { p = String(p || "").trim(); if (!p) return; var l = JSON.parse(ls("attPayers") || "[]").filter(function (x) { return x !== p; }); l.unshift(p); ls("attPayers", JSON.stringify(l.slice(0, 6))); }
function nobodyScanned(day) { return day && day.src === "DAILY" && (day.rows || []).every(function (r) { return noT(r.in) && noT(r.out) && SPECIAL.indexOf(r.status) < 0; }); }

/* r = แถววันนั้น · a = รายการเบิกเดิม (แก้) · pre = ค่าที่กรอกค้าง (กลับจากกล้อง / ทำใหม่จากที่ส่งไม่ผ่าน) */
function advForm(r, a, pre) {

  var edit = !!a, lp = payers();
  var st = { amt: pre.amt != null ? String(pre.amt) : edit ? String(a.amt) : "", photo: pre.photo || "", payer: pre.payer != null ? pre.payer : edit ? (a.payer || "") : (lp[0] || ""),
    time: pre.time || (edit ? (a.time || "") : nowHM()), note: pre.note != null ? pre.note : edit ? (a.note === "ยอดเดิมในชีต" ? "" : (a.note || "")) : "" };
  var init = JSON.stringify(st);
  var isToday = BOOT && r.date === BOOT.today;
  var h = "<h3>" + (edit ? "✏️ แก้รายการเบิก" : "💸 เบิกเงิน") + " — " + esc(r.name) + "</h3>"
    + '<div class="sub">' + esc(thDate(r.date, true)) + (isToday ? "" : " · บันทึกย้อนหลัง") + "</div>" + perLine(r);
  if (!edit && nobodyScanned(DAY) && DAY.date === r.date) h += '<div class="warn">⚠ วันนี้ยังไม่มีใครสแกนเข้า — ถ้าทั้งวันไม่มีใครมาทำงาน ยอดเบิกของวันนี้อาจไม่ถูกนับ</div>';
  h += '<label class="lb">จำนวนเงิน (บาท)</label><input class="in big" id="fAmt" inputmode="decimal" placeholder="0" value="' + esc(st.amt) + '">'
    + '<div class="chips" id="qAmt">' + [100, 200, 300, 500, 1000].map(function (n) { return '<button class="chip" data-v="' + n + '">' + n.toLocaleString("en-US") + "</button>"; }).join("") + "</div>"
    + '<div class="ph"><label class="cam" id="camL">' + camInner(st.photo || (edit ? a.photo : "")) + '<input type="file" accept="image/*" capture="environment" id="fCam"></label></div>'
    + '<button class="lnk" id="galB">หรือเลือกจากคลังรูป</button><input type="file" accept="image/*" id="fGal" style="display:none">'
    + '<label class="lb">ผู้จ่าย</label><input class="in" id="fPayer" placeholder="ใครจ่ายเงิน" value="' + esc(st.payer) + '" maxlength="40">'
    + (lp.length ? '<div class="chips" id="qPay">' + lp.map(function (p) { return '<button class="chip' + (p === st.payer ? " on" : "") + '" data-v="' + esc(p) + '">' + esc(p) + "</button>"; }).join("") + "</div>" : "")
    + '<div class="g2"><div><label class="lb">เวลาเบิก</label><input class="in" type="time" id="fTime" value="' + esc(st.time) + '"></div>'
    + '<div><label class="lb">หมายเหตุ</label><input class="in" id="fNote" placeholder="ไม่ใส่ก็ได้" value="' + esc(st.note) + '" maxlength="200"></div></div>'
    + '<button class="save" id="fSave"></button>' + (edit ? '<button class="del" id="fDel">🗑 ลบรายการเบิกนี้</button>' : "");
  openSheet(h);
  var amt = $("fAmt");
  function label() { var v = parseFloat(String(amt.value).replace(/,/g, "")); $("fSave").textContent = (edit ? "บันทึกการแก้ " : "บันทึกเบิก ") + (v > 0 ? baht(v) : ""); }
  label();
  amt.oninput = function () { st.amt = amt.value; label(); };
  $("qAmt").onclick = function (e) { var c = e.target.closest("[data-v]"); if (!c) return; amt.value = c.getAttribute("data-v"); st.amt = amt.value; label(); };
  var qp = $("qPay");
  if (qp) qp.onclick = function (e) { var c = e.target.closest("[data-v]"); if (!c) return; $("fPayer").value = c.getAttribute("data-v"); st.payer = $("fPayer").value;
    [].forEach.call(qp.children, function (x) { x.classList.toggle("on", x === c); }); };
  $("fPayer").oninput = function () { st.payer = this.value; };
  $("fTime").oninput = function () { st.time = this.value; };
  $("fNote").oninput = function () { st.note = this.value; };
  var me = null;   // ฟอร์มนี้ (ย่อรูปเสร็จหลังปิดฟอร์ม/เปิดฟอร์มอื่น = ทิ้งผล)
  function takePhoto(inp) {

    shrinkPhoto(f).then(function (u) { if (FORM === me) st.photo = u; }, function () { if (FORM === me) toast("❌ อ่านรูปไม่ได้ ลองถ่ายใหม่", true); })
      .then(function () {
        st.shrinking--;

      });
  }

function camInner(photo) {

}
// ย่อรูปแบบเดียวกับหน้าเว็บ: ด้านยาวสุด 1280px · JPEG 0.72
function shrinkPhoto(file) {
  return new Promise(function (res, rej) {
    var fr = new FileReader();
    fr.onerror = rej;
    fr.onload = function () {
      var im = new Image();
      im.onerror = rej;
      im.onload = function () {
        var k = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement("canvas");
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.72));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
/* retry = รหัสรายการที่ส่งไม่ผ่านซึ่งฟอร์มนี้ทำใหม่ (บันทึกสำเร็จ = ทิ้งรายการเก่า · ปิดฟอร์มไม่บันทึก = รายการเก่าอยู่ต่อ) */
function saveAdv(r, a, st, btn, retry) {
  if (BUSY) return;
  var amt = parseFloat(String(st.amt).replace(/,/g, ""));
  if (!(amt > 0)) { toast("ใส่จำนวนเงินก่อน", true); $("fAmt").focus(); return; }
  if (st.time && !/^\d{1,2}:\d{2}$/.test(st.time)) { toast("เวลาไม่ถูกต้อง", true); return; }
  var more = a ? amt - (+a.amt || 0) : amt;

      ch.forEach(function (x) {
        if (x.field === "in" || x.field === "out") pre[x.field] = x.value === "--:--" ? "" : x.value;
        else if (x.field === "pay" && x.value === "") pre.payAuto = true;
        else pre[x.field] = x.value;
      });
      editForm(r, pre);
    });
  } else {
    toast("รายการนี้ทำใหม่จากแอพไม่ได้ — กดทิ้ง แล้วทำใหม่เอง", true);
  }
}
window.appOpen = function (v) { if (v === "fail") showFails(true); };

/* ═══ เมนู ═══ */
function theme() { var t = ls("attTheme") || "auto"; if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); }
function bigText() { document.documentElement.style.setProperty("--fs", ls("attBig") === "1" ? "17px" : "15px"); }
theme(); bigText();
function menu() {
  var st = LAPP.state && LAPP.state() || {}, t = ls("attTheme") || "auto";
  var h = "<h3>เมนู</h3>"
    + '<button class="mi" data-m="sync"><span>🔄</span><div>ดึงข้อมูลจากเว็บตอนนี้<small>' + (st.lastOk ? "ตรงกับเว็บล่าสุด " + esc(String(st.lastOk).replace("T", " ").slice(0, 16)) : "ยังไม่เคยดึงสำเร็จ") + "</small></div></button>"
    + '<button class="mi" data-m="fail"><span>⚠</span><div>รายการส่งไม่ผ่าน<small>' + ((st.failed || []).length ? (st.failed.length + " รายการ — แตะเพื่อทำใหม่") : "ไม่มี") + "</small></div></button>"
    + '<button class="mi" data-m="full"><span>🖥️</span><div>เปิดหน้าเต็มแบบในคอม<small>ประวัติหลายวัน · รายเดือน · ทุกอย่างแบบหน้าเว็บ</small></div></button>'
    + '<button class="mi" data-m="theme"><span>🌗</span><div>สีหน้าจอ<small>' + { auto: "ตามมือถือ", light: "สว่าง", dark: "มืด" }[t] + " — แตะเพื่อเปลี่ยน</small></div></button>"
    + '<button class="mi" data-m="big"><span>🔠</span><div>ตัวหนังสือ<small>' + (ls("attBig") === "1" ? "ใหญ่" : "ปกติ") + " — แตะเพื่อเปลี่ยน</small></div></button>"
    + '<button class="mi" data-m="link"><span>🔑</span><div>เปลี่ยนลิงก์ / รหัสเจ้าของ<small>ใช้เมื่อเปลี่ยนรหัสเจ้าของบนเว็บ</small></div></button>'
    + '<div class="hint" style="text-align:center;margin-top:10px" id="ver"></div>';
  openSheet(h);
  try { $("ver").textContent = "รุ่นแอพ " + JSON.parse(ShopAndroid.link()).version + (LAPP.webBuild ? " · กติกาเว็บ " + LAPP.webBuild : ""); } catch (e) { $("ver").textContent = ""; }
  $("sheet").onclick = function (e) {
    var m = e.target.closest("[data-m]"); if (!m) return;
    var k = m.getAttribute("data-m");
    if (k === "sync") { closeSheet(); LAPP.sync().then(function () { toast("กำลังดึงข้อมูลจากเว็บ…"); }, function (x) { toast("❌ " + x.message, true); }); }
    if (k === "fail") { closeSheet(); showFails(true); }
    if (k === "full") { closeSheet(); location.href = "index.html"; }
    if (k === "theme") { ls("attTheme", { auto: "light", light: "dark", dark: "auto" }[t]); theme(); closeSheet(); menu(); }
    if (k === "big") { ls("attBig", ls("attBig") === "1" ? "0" : "1"); bigText(); closeSheet(); menu(); }
    if (k === "link") { closeSheet(); try { parent.goSetup(); } catch (x) {} }
  };
}
/* ป้ายเตือนรหัสเจ้าของเปลี่ยน / ค้างส่งนาน */
setInterval(function () {
  dayRoll();
  var st = LAPP.state && LAPP.state(), h = "";
  // คำสั่งที่รอส่งแต่คิดบนชีตชุดใหม่ไม่ได้ (หายจากหน้าจอแต่ยังรอส่งอยู่) — บอกไว้ กันบันทึกซ้ำ
  var bad = (LAPP.bad || []).map(function (lid) { var c = st && (st.q || []).filter(function (x) { return x.lid === lid; })[0]; return c ? c.label : ""; }).filter(Boolean);
  if (st && st.needLink) h = '<div class="banner" id="bnL">🔑 ' + esc(st.needLink) + " — แตะที่นี่</div>";
  else if (bad.length) h = '<div class="banner w">⏳ รอส่งขึ้นเว็บ (ยังแสดงในหน้านี้ไม่ได้): ' + esc(bad.join(" · ")) + " — อย่าบันทึกซ้ำ</div>";
  else if (st && st.oldest && Date.now() - st.oldest > 3 * 3600e3) h = '<div class="banner w">⏳ มีรายการค้างส่งตั้งแต่ ' + esc(new Date(st.oldest).toLocaleString("th-TH")) + " — ต่ออินเทอร์เน็ตแล้วแอพส่งเอง</div>";
  if ($("bn").innerHTML !== h) { $("bn").innerHTML = h; var l = $("bnL"); if (l) l.onclick = function () { try { parent.goSetup(); } catch (x) {} }; }
}, 3000);
</script>
</body></html>
